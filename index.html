<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A Jungle Full of Dinos 🦕 - Devcats Wimmelbild</title>
  <meta name="description" content="Gemütliches 2D-Wimmelbildspiel im echten Devcats-Stil: Finde alle 22 im Zimmer gezeichneten Dinos!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Game Container with Pan & Zoom Viewport -->
  <main id="game-container">
    
    <!-- Top-Left Devcats HUD with Hint Cooldown -->
    <header class="hud-top-left" aria-label="Spielstand und Hinweise">
      <div class="counter-badge" id="counter-pill">
        <button class="hint-btn" id="hint-btn" title="Hinweis anzeigen (Lupe)" aria-label="Hinweis">
          <svg class="hint-icon" viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="7"/>
            <line x1="16" y1="16" x2="22" y2="22"/>
          </svg>
          <div class="hint-cooldown-text" id="hint-cooldown-text">5s</div>
        </button>
        <div class="counter-section">
          <span class="counter-icon">🦕</span>
          <span id="dino-count">22</span>
        </div>
      </div>
    </header>

    <!-- Top-Right Controls -->
    <nav class="hud-top-right">
      <button class="hud-btn icon-only" id="mute-btn" title="Ton an/aus" aria-label="Ton umschalten">🔊</button>
      <button class="hud-btn" id="reset-btn" title="Spiel neu starten">Neustart 🔄</button>
    </nav>

    <!-- Bottom Left Instructions -->
    <div class="instructions-pill">
      <span>🔍 Finde alle 22 niedlichen Dinos im Bild • Klicken zum Einfärben</span>
    </div>

    <!-- Bottom Right Zoom Controls -->
    <aside class="zoom-controls">
      <button class="zoom-btn" id="zoom-in-btn" title="Vergrößern">+</button>
      <div class="zoom-divider"></div>
      <button class="zoom-btn" id="zoom-out-btn" title="Verkleinern">−</button>
      <div class="zoom-divider"></div>
      <button class="zoom-btn" id="zoom-reset-btn" title="Ansicht anpassen">⛶</button>
    </aside>

    <!-- Floating Toast Notification -->
    <div class="toast-msg" id="toast-msg"></div>

    <!-- Scalable World Viewport (1376 x 768) -->
    <div id="world-viewport">
      
      <svg id="game-svg" viewBox="0 0 1376 768" xmlns="http://www.w3.org/2000/svg">
        
        <!-- 1. HIGH-RES DEVCATS BACKGROUND WITH HAND-DRAWN DINOS -->
        <image id="bg-img" href="background.jpg" width="1376" height="768" preserveAspectRatio="none"/>

        <!-- ================================================================
             2. ALL 22 HAND-DRAWN DINO TARGETS 🦕
             Only flawless, cute Sauropod dinos with perfect Devcats coloring!
             ================================================================ -->

        <!-- Dino #1: Buchstapel unten links (X: 67, Y: 677) -->
        <g class="dino-target" id="dino-1" data-dino-id="1" data-x="67" data-y="677">
          <circle class="dino-hitbox" cx="67" cy="677" r="38"/>
          <image class="dino-green-overlay" href="assets/dino_green_1.png" x="40" y="645" width="55" height="65"/>
        </g>

        <!-- Dino #2: Schlafend auf Kissen (X: 430, Y: 610) -->
        <g class="dino-target" id="dino-2" data-dino-id="2" data-x="430" data-y="610">
          <circle class="dino-hitbox" cx="430" cy="610" r="56"/>
          <image class="dino-green-overlay" href="assets/dino_green_2.png" x="380" y="565" width="100" height="90"/>
        </g>

        <!-- Dino #3: Auf Holzstuhl sitzend (X: 622, Y: 597) -->
        <g class="dino-target" id="dino-3" data-dino-id="3" data-x="622" data-y="597">
          <circle class="dino-hitbox" cx="622" cy="597" r="58"/>
          <image class="dino-green-overlay" href="assets/dino_green_3.png" x="580" y="545" width="85" height="105"/>
        </g>

        </g>

        </g>

        <g class="dino-target" id="dino-16" data-dino-id="16" data-x="525" data-y="310">

          <image class="dino-green-overlay" href="assets/dino_green_16.png" x="495" y="270" width="60" height="80"/>
        </g>

        <!-- Dino #17: Auf Schrank oben neben Blumentopf (X: 412, Y: 125) -->

        </g>

        <!-- Dino #20: Niedriges Regal neben schrägem Buch (X: 229, Y: 526) -->
        <g class="dino-target" id="dino-20" data-dino-id="20" data-x="229" data-y="526">
          <circle class="dino-hitbox" cx="229" cy="526" r="30"/>
          <image class="dino-green-overlay" href="assets/dino_green_20.png" x="212" y="502" width="34" height="48"/>
        </g>

        <!-- Dino #21: Oberes Wandregal neben Bildrahmen (X: 910, Y: 70) -->
        <g class="dino-target" id="dino-21" data-dino-id="21" data-x="910" data-y="70">
          <circle class="dino-hitbox" cx="910" cy="70" r="34"/>
          <image class="dino-green-overlay" href="assets/dino_green_21.png" x="885" y="42" width="50" height="56"/>
        </g>

        <!-- Dino #22: Regal 2 kriechend auf Buchstapel rechts (X: 1347, Y: 251) -->
        <g class="dino-target" id="dino-22" data-dino-id="22" data-x="1347" data-y="251">
          <circle class="dino-hitbox" cx="1347" cy="251" r="29"/>
          <image class="dino-green-overlay" href="assets/dino_green_22.png" x="1324" y="238" width="46" height="27"/>

      </svg>
    </div>

  </main>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Victory / Win Modal -->
  <section id="victory-modal" role="dialog" aria-modal="true" aria-labelledby="vic-title">
    <div class="victory-card">
      <h1 class="victory-title" id="vic-title">🎉 Raum Entdeckt!</h1>
      <p class="victory-subtitle">
        Du hast alle <strong>22 niedlichen Dinos 🦕</strong> im gemütlichen Forscher-Zimmer gefunden!
      </p>

      <div class="victory-stats">
        <div class="stat-pill">
          <span>🦕</span>
          <span>22 / 22 Dinos gefunden</span>
        </div>
      </div>

      <button class="play-again-btn" id="play-again-btn">Erneut spielen 🌿</button>
    </div>
  </section>

  <!-- Game Scripts -->
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
